# Netlify configuration – connecting this repository is all that's needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.0"
  ASTRO_TELEMETRY_DISABLED = "1"

# "/" → language home. Armenian is the default; a visitor who explicitly chose
# English (cookie set by the language switch) goes to /en/. No geo/Accept-Language guessing.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = { Cookie = ["sf_lang_en"] }

[[redirects]]
  from = "/"
  to = "/hy/"
  status = 302
  force = true

# Short language aliases
[[redirects]]
  from = "/am/*"
  to = "/hy/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
